name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Type Check, Build & Pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The dependencies the extension ships must have no high or critical advisories.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Advisories of the development tools are reported without failing the build, as they run
      # only on the machines of developers and in CI, and wait on releases of those tools.
      - name: Audit development dependencies
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Type check and lint
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run e2e tests
        run: xvfb-run -a npm run test:e2e
